interface:
  display_name: "爆款复刻套件更新"
  short_description: "更新套件四个技能并保留备份"
  default_prompt: "使用 $remake-suite-updater 检查并更新套件，保留用户项目。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: [codex, generic]
  activation:
    mode: manual
    paths: []
  execution:
    context: inline
    shell: bash
  trust:
    source_tier: local
    remote_inline_execution: forbid
    remote_metadata_policy: treat-as-untrusted-data
  degradation:
    codex: neutral-source-plus-openai-metadata
    generic: neutral-source
