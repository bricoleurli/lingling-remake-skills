interface:
  display_name: "爆款复刻工作室"
  short_description: "统一衔接拆解、生成能力配置与本地工作台"
  default_prompt: "使用 $remake-studio 检查项目阶段和生成能力，衔接拆解技能与工作台技能，保留已确认结果并完成当前任务。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: [codex, generic]
  activation:
    mode: manual
    paths: []
  execution:
    context: inline
    shell: bash
  trust:
    source_tier: local
    remote_inline_execution: forbid
    remote_metadata_policy: treat-as-untrusted-data
  degradation:
    codex: neutral-source-plus-openai-metadata
    generic: neutral-source
