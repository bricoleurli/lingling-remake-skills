<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流程审阅</title>
<style>
:root{--paper:#f7f5f0;--surface:#fffefa;--ink:#292c29;--muted:#646961;--line:#dedfd6;--accent:#285d50;--accent-soft:#e8f1e9;--slot:#843d00;--slot-bg:#fff0c7;--code:#f0f1eb;--focus:#a34b05;--radius:12px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}a{color:var(--accent);text-underline-offset:4px}a:hover{color:#163e33}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}::selection{background:#f8dfa7;color:#302211}button:disabled{cursor:default;color:var(--muted);opacity:.6}h1,h2,h3,p{margin:0}h1{font-size:30px;line-height:1.35;font-weight:690;letter-spacing:-.025em}h2{font-size:20px;line-height:1.4}h3{font-size:17px;line-height:1.4}p{max-width:72ch}small{font-size:13px;color:var(--muted)}.appbar{border-bottom:1px solid var(--line);background:var(--surface)}.bar-inner{max-width:1200px;margin:auto;padding:16px 28px;display:flex;gap:20px;align-items:center;justify-content:space-between}.brand{font-weight:680;color:var(--ink);text-decoration:none}.stage-label{font-size:14px;color:var(--muted)}.stage-nav{max-width:1200px;margin:auto;display:flex;padding:0 28px;gap:4px;overflow:auto}.stage-nav a,.stage-nav span{white-space:nowrap;font-size:13px;display:block;padding:12px 10px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}.stage-nav a:hover{background:var(--accent-soft)}.stage-nav [aria-current=page]{color:var(--accent);border-bottom-color:var(--accent);font-weight:650}.stage-nav .unavailable{color:#72766f}.main{max-width:1144px;margin:auto;padding:32px 28px 48px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.status{white-space:nowrap;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:5px;display:inline-flex}.subtitle{margin-top:12px;color:var(--muted)}.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:20px;font-size:14px}.meta span{display:inline-flex;gap:6px;align-items:baseline}.meta b{font-weight:650;font-variant-numeric:tabular-nums}.subnav{display:flex;gap:20px;margin-top:20px}.subnav a{font-size:14px}.subnav [aria-current=page]{font-weight:650}.provenance{margin-top:20px;padding:12px 16px;background:#eceee7;border-radius:6px;font-size:13px;color:#545b50}.question{margin-top:24px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.question h2{font-size:15px;color:var(--accent);margin-bottom:8px}.question p{font-size:17px}.question .hint{font-size:13px;color:var(--muted);margin-top:8px}.group{margin-top:30px}.group-heading{display:flex;gap:16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}.group-heading small{font-size:13px}.item-list{border-top:1px solid var(--line)}.item-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:18px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}.thumb{width:52px;height:66px;object-fit:cover;border:1px solid var(--line);border-radius:5px;background:var(--surface)}.item-no{width:44px;color:var(--muted);font-size:18px;font-variant-numeric:tabular-nums}.item-description{font-size:14px;color:var(--muted);margin-top:4px;max-width:76ch}.item-caption{font-size:12px;color:var(--muted);margin-top:5px}.btn{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:6px;min-height:40px;padding:7px 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;font-size:14px;white-space:nowrap}.btn:hover{border-color:var(--accent);background:var(--accent-soft)}.btn:active{background:#d8e8dc}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.primary:hover{background:#1c493d}.footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.footer a{font-size:13px}.empty{padding:24px 0;color:var(--muted)}
/* Native dialog keeps focus inside the requested side drawer. */
dialog{position:fixed;inset:0 0 0 auto;margin:0;width:min(880px,88vw);height:100dvh;max-height:none;max-width:none;border:0;padding:0;background:var(--surface);color:var(--ink);box-shadow:-14px 0 50px #18241b24}dialog::backdrop{background:#26302966}.drawer-shell{height:100%;display:flex;flex-direction:column}.drawer-head{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;padding:22px 26px 16px;border-bottom:1px solid var(--line)}.drawer-head h2{font-size:23px}.drawer-head p{font-size:13px;color:var(--muted);margin-top:5px}.close{flex:none;border:1px solid var(--line);background:transparent;border-radius:6px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}.close:hover{background:var(--code)}.close svg{width:18px;height:18px}.tabs{display:flex;flex:none;gap:6px;padding:10px 26px;border-bottom:1px solid var(--line);overflow-x:auto}.tab{border:0;background:transparent;white-space:nowrap;border-radius:5px;color:var(--muted);font-size:14px;padding:8px 11px;min-height:38px}.tab:hover{background:var(--code)}.tab[aria-selected=true]{background:var(--accent-soft);color:var(--accent);font-weight:650}.panel{padding:22px 26px;overflow:auto;flex:1;min-height:0;overscroll-behavior:contain}.panel .text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85}.codebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--code);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;font-size:13px;color:var(--muted)}.copy{min-height:34px;padding:4px 10px;font-size:13px}pre{margin:0;background:#f5f5ee;border:1px solid var(--line);border-radius:0 0 8px 8px;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font:13px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}mark.slot,.slot-name{background:var(--slot-bg);color:var(--slot);border-radius:3px;padding:1px 3px;font-weight:650}.legend{display:flex;gap:8px;align-items:center;margin-bottom:14px;color:var(--muted);font-size:13px}.slot-card{padding:16px 0;border-bottom:1px solid var(--line)}.slot-card:first-child{padding-top:0}.slot-head{display:flex;gap:12px;align-items:center;justify-content:space-between}.slot-card p{font-size:13px;color:var(--muted);margin:7px 0}.slot-value{font:14px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--code);padding:12px;border-radius:5px}.fact{padding:12px 0;border-bottom:1px solid var(--line)}.fact:first-child{padding-top:0}.fact dt{font-size:13px;color:var(--muted);margin-bottom:4px}.fact dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.image-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.image-pair.single{grid-template-columns:minmax(0,1fr);max-width:440px;margin:auto}.image-pair figure{margin:0}.image-pair img{width:100%;height:auto;display:block;border-radius:5px}.image-pair figcaption{font-size:13px;color:var(--muted);margin-top:8px}.drawer-note{margin-top:18px;font-size:14px;color:var(--muted);white-space:pre-wrap}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#263c31;color:white;padding:9px 16px;border-radius:6px;font-size:14px;z-index:5;max-width:90vw}.toast:empty{display:none}
@media(max-width:700px){.bar-inner{padding:12px 16px;gap:10px}.stage-label{font-size:12px}.stage-nav{padding:0 8px}.main{padding:24px 16px 36px}h1{font-size:25px}.heading{gap:10px;flex-wrap:wrap}.item-row{gap:12px;grid-template-columns:42px minmax(0,1fr)}.thumb{width:42px;height:55px}.item-row>.btn{grid-column:2;justify-self:start;margin-top:-2px}.item-description{font-size:13px}.item-no{font-size:16px}.meta{gap:6px 16px}.group-heading{flex-wrap:wrap;gap:4px}dialog{width:100%;height:100dvh}.drawer-head{padding:18px 16px 14px}.drawer-head h2{font-size:20px}.tabs{padding:8px 12px}.panel{padding:18px 16px}.codebar{align-items:flex-start}.image-pair{gap:10px}.question p{font-size:16px}.footer{gap:12px}}
@media(prefers-reduced-motion:no-preference){dialog[open] .drawer-shell{animation:drawer-in .18s ease-out}@keyframes drawer-in{from{transform:translateX(28px)}to{transform:translateX(0)}}}
</style></head>
<body>
<header class="appbar"><div class="bar-inner"><a class="brand" id="home">复刻流程审阅</a><span class="stage-label" id="stage-label"></span></div><nav class="stage-nav" id="nav" aria-label="步骤导航"></nav></header>
<main class="main" id="main"><div class="heading"><h1 id="title"></h1><span class="status" id="status"></span></div><p class="subtitle" id="summary"></p><div class="meta" id="meta"></div><nav class="subnav" id="subnav" aria-label="阶段内导航"></nav><p class="provenance" id="provenance"></p><section class="question" id="question"></section><div id="groups"></div><footer class="footer" id="footer"></footer></main>
<dialog id="drawer" aria-labelledby="drawer-title"><div class="drawer-shell"><header class="drawer-head"><div><h2 id="drawer-title"></h2><p id="drawer-caption"></p></div><button class="close" id="close" aria-label="关闭详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><div class="tabs" id="tabs" role="tablist" aria-label="详情内容"></div><div class="panel" id="panel" role="tabpanel" tabindex="0"></div><div class="toast" id="toast" role="status" aria-live="polite"></div></div></dialog>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('review-data').textContent);
// Only the current case index contains routes; historic stage content stays frozen.
const route=data.routes?.[new URLSearchParams(window.location.search).get('stage')];
if(route)window.location.replace(route);
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n};
const textValue=v=>typeof v==='string'?v:JSON.stringify(v,null,2);
function link(label,href,cls){const a=el('a',cls,label);a.href=href;return a}
function highlight(text){const frag=document.createDocumentFragment();let last=0;for(const m of text.matchAll(/\{\{[^{}]+\}\}/g)){frag.append(document.createTextNode(text.slice(last,m.index)),el('mark','slot',m[0]));last=m.index+m[0].length}frag.append(document.createTextNode(text.slice(last)));return frag}
let toastTimer;function toast(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',2400)}
async function copyText(text,button){try{let copied=false;if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(text);copied=true}catch{}}if(!copied){const ta=el('textarea');ta.value=text;ta.setAttribute('aria-label','复制内容');ta.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';$('panel').append(ta);ta.focus();ta.select();copied=document.execCommand('copy');ta.remove();if(!copied)throw Error('clipboard unavailable')}button.focus({preventScroll:true});toast('已复制完整内容')}catch{toast('未能自动复制，请在文本框中选择并复制')}}
function copyButton(text,label='复制全文'){const b=el('button','btn copy',label);b.type='button';b.onclick=()=>copyText(text,b);return b}
function codeBlock(text,label){const wrap=el('div');const bar=el('div','codebar');bar.append(el('span','',label||'完整提示词'),copyButton(text));const pre=el('pre');const c=el('code');c.append(highlight(text));pre.append(c);wrap.append(bar,pre);return wrap}
let opener=null,lockedScroll=0,previousBodyStyle='',currentItem;
function openItem(item,button){opener=button;currentItem=item;$('drawer-title').textContent=item.title;$('drawer-caption').textContent=item.caption||item.description||'';buildTabs(item.tabs||[{label:'说明',type:'text',content:item.description||'暂无详情'}]);lockedScroll=window.scrollY;previousBodyStyle=document.body.getAttribute('style')||'';document.body.style.position='fixed';document.body.style.top=`-${lockedScroll}px`;document.body.style.width='100%';$('drawer').showModal();$('close').focus({preventScroll:true})}
function closeDrawer(){if($('drawer').open)$('drawer').close()}
$('close').onclick=closeDrawer;
$('drawer').addEventListener('click',e=>{if(e.target!==$('drawer'))return;const r=$('drawer').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDrawer()});
$('drawer').addEventListener('close',()=>{document.body.setAttribute('style',previousBodyStyle);window.scrollTo(0,lockedScroll);opener?.focus({preventScroll:true})});
function buildTabs(tabs){$('tabs').replaceChildren();tabs.forEach((tab,i)=>{const b=el('button','tab',tab.label);b.id=`detail-tab-${i}`;b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-controls','panel');b.onclick=()=>selectTab(tabs,i);b.onkeydown=e=>{let j;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;if(j!==undefined){e.preventDefault();selectTab(tabs,j);$('tabs').children[j].focus()}};$('tabs').append(b)});selectTab(tabs,0)}
function selectTab(tabs,index){[...$('tabs').children].forEach((b,i)=>{b.setAttribute('aria-selected',String(i===index));b.tabIndex=i===index?0:-1});$('panel').setAttribute('aria-labelledby',`detail-tab-${index}`);$('panel').replaceChildren();$('panel').scrollTop=0;const t=tabs[index],p=$('panel');
 if(t.type==='code'){if(/\{\{[^{}]+\}\}/.test(t.content)){const legend=el('div','legend');legend.append(el('mark','slot','{{槽位}}'),el('span','','黄色标记为可替换内容；复制时保留原始文字。'));p.append(legend)}p.append(codeBlock(t.content,t.label))}
 else if(t.type==='slots'){if(!t.content.length)p.append(el('p','empty','这一页没有文字槽位。'));for(const s of t.content){const card=el('div','slot-card'),head=el('div','slot-head');head.append(el('code','slot-name',`{{${s.name}}}`),copyButton(textValue(s.value),'复制值'));card.append(head);if(s.description)card.append(el('p','',s.description));card.append(el('div','slot-value',textValue(s.value)));p.append(card)}}
 else if(t.type==='facts'){const dl=el('dl');for(const [key,value] of Object.entries(t.content)){const row=el('div','fact');row.append(el('dt','',key),el('dd','',textValue(value)));dl.append(row)}p.append(dl)}
 else if(t.type==='images'){const grid=el('div','image-pair'+(t.content.length===1?' single':''));for(const im of t.content){const f=el('figure'),a=link('',im.src),img=el('img');img.src=im.src;img.alt=im.label||'图片';a.append(img);f.append(a,el('figcaption','',im.label||''));grid.append(f)}p.append(grid);if(t.note)p.append(el('p','drawer-note',t.note))}
 else{p.append(el('div','text',textValue(t.content)))}
}
$('title').textContent=data.title;document.title=data.title+' · 复刻流程';$('status').textContent=data.status||'草案';$('stage-label').textContent=data.stage_label||'';$('summary').textContent=data.summary||'';
$('home').href=data.home||'#';for(const n of data.navigation||[]){const node=n.href?link(n.label,n.href):el('span','unavailable',n.label);if(n.current)node.setAttribute('aria-current','page');$('nav').append(node)}
for(const m of data.metrics||[]){const s=el('span');s.append(el('b','',m.value),el('span','',m.label));$('meta').append(s)}
for(const n of data.subnavigation||[]){const a=link(n.label,n.href);if(n.current)a.setAttribute('aria-current','page');$('subnav').append(a)}
$('provenance').textContent=data.provenance||'';$('provenance').hidden=!data.provenance;
if(data.question){$('question').append(el('h2','',data.question.title||'这一步需要你确认'),el('p','',data.question.text));if(data.question.hint)$('question').append(el('p','hint',data.question.hint))}else $('question').hidden=true;
for(const group of data.groups||[]){const section=el('section','group'),heading=el('div','group-heading');heading.append(el('h2','',group.title));if(group.hint)heading.append(el('small','',group.hint));section.append(heading);const list=el('div','item-list');for(const [i,item] of group.items.entries()){const row=el('article','item-row');if(item.image){const img=el('img','thumb');img.src=item.image;img.alt=item.image_alt||item.title;img.loading='lazy';row.append(img)}else row.append(el('div','item-no',item.number||String(i+1).padStart(2,'0')));const body=el('div');body.append(el('h3','',item.title));if(item.description)body.append(el('p','item-description',item.description));if(item.caption)body.append(el('p','item-caption',item.caption));row.append(body);if(item.href)row.append(link(item.action||'打开阶段',item.href,'btn'));else{const b=el('button','btn',item.action||'查看详情');b.type='button';b.setAttribute('aria-haspopup','dialog');b.setAttribute('aria-label',`${item.action||'查看详情'}：${item.title}`);b.onclick=()=>openItem(item,b);row.append(b)}list.append(row)}section.append(list);$('groups').append(section)}
for(const l of data.links||[])$('footer').append(link(l.label,l.href));if(data.footer)$('footer').append(el('span','',data.footer));
</script>
</body></html>
